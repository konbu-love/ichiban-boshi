name: data-audit

# 手動実行専用。GitHubの「Actions」タブ → data-audit → 「Run workflow」で実行する。
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 監査ロジックのテスト(合成データ)
        run: node --test tests/*.test.mjs

      - name: データとライブラリを取得(d3-celestialは版を固定)
        run: npm install --no-save --prefix .audit-deps d3-celestial@0.7.35 astronomy-engine

      - name: データ監査を実行(Wikipediaから座標候補も取得)
        run: |
          node audit/audit.mjs \
            --data-dir .audit-deps/node_modules/d3-celestial/data \
            --out out \
            --version "$(node -p "require('./.audit-deps/node_modules/d3-celestial/package.json').version")" \
            --wikipedia

      - name: 天文ライブラリの動作確認
        run: |
          node audit/astro-smoke.mjs \
            --deps .audit-deps \
            --stars .audit-deps/node_modules/d3-celestial/data/stars.6.json \
            --out out

      - name: 結果を実行画面(Summary)に表示
        run: |
          cat out/audit-report.md >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          cat out/astro-smoke.md >> "$GITHUB_STEP_SUMMARY"

      - name: レポートをリポジトリに保存(docs/audit/)
        run: |
          mkdir -p docs/audit
          cp out/audit-report.md out/audit-report.json out/astro-smoke.md out/astro-smoke.json out/lines.hip.json docs/audit/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/audit
          git commit -m "データ監査レポートを更新" || echo "変更なし"
          git push || echo "pushに失敗(権限を確認)"
